name: CI

on:
  # Push runs only for main; PR commits are covered by pull_request, so a
  # branch with an open PR is not checked twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit gets a full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to full commit SHAs (tags can be moved); the trailing
# comment is the release the SHA resolved from. Dependabot keeps both current.
jobs:
  check:
    # macOS: the Wails main package needs CGo against WebKit/Cocoa, and macOS
    # is the only platform implemented (internal/platform has darwin code).
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # main.go embeds frontend/dist, so the frontend must be built before any
      # Go tool type-checks the root package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Differential fuzz: engine parser vs net/http (oracle). A short run per
      # commit catches regressions; long runs happen locally.
      - name: go fuzz (parser differential)
        run: go test -run='^$' -fuzz=FuzzReadRequestDifferential -fuzztime=30s ./internal/engine/

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
